services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./Backend/config.env
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
